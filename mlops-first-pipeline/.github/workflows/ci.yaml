# GitHub actions workflow
# GitHub automatically looks for workflow file inside .github/workflows/

# Give workflow a meaningful name
name: Iris ML API - CI Pipeline

# Define when GitHub should run this workflow
on:
    # Run CI whenever code is pushed to the main branch
    push:
        branches:
            - main
    
    # Also validate proposed changes before they are merged
    pull_request:
        branches:
            - main

# Permissions are restricted to reading repo content only
permissions:
  contents: read
  packages: write

# Define the jobs that make up the pipeline
jobs:
    # JOB-1 Test API - Validates the API
    test:
      name: Run API Tests
      # GitHub provides a fresh Ubuntu VM for this job
      runs-on: ubuntu-latest

      # Steps
      steps:
          # Step-1: Download the repo content to the runner
        - name: Check out repository
          uses: actions/checkout@v4
        
        # Step-2: Install Python on runner
        - name: Install Python on Runner
          uses: actions/setup-python@v5
          with:
            python-version: "3.14"
        
        # Step-3: Install the dependencies needed to run the tests
        - name: Install Python Dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
        
        # Step-4: Execute the automated tests
        - name: Run automated tests
          run: python -m pytest -v
      
    # JOB-2 Build and publish Docker Image
    build:
      name: Build and Publish Docker Image
      needs: test

      runs-on: ubuntu-latest

      # Publish only when code is pushed to main
      if: github.event_name == 'push' && github.ref == 'ref/heads/main'
      steps:
        # Download repo source code
        - name: Checkout source code
          uses: actions/checkout@v4
        
        # Enable Docker Buildkit functionality
        - name: Set up Docker Buildx
          uses: docker/setup-buildx-action@v3
        
        # Authenticate with GHCR
        - name: Login to GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}
        
        # Generate image names and tags
        - name: Generate Docker metadata
          id: meta
          uses: docker/metadata-action@v5
          with:
            images: ghcr.io/${{ github.repository }}
            tags: |
              type=raw, value=latest
              type=sha, format=short
          
        # Build the docker image and push it to GHCR
        - name: Build and Push Docker Image
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            tags: ${{ steps.meta.outputs.tags }}
            labels: ${{ steps.meta.outputs.labels }}
